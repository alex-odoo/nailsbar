services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Loopback only: nginx on the box proxies to it. A Docker-published port
      # bypasses ufw, so 0.0.0.0 would rely on the Hetzner firewall alone.
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: file:/data/nailsbar.db
      SESSION_SECRET: ${SESSION_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_IDS: ${TELEGRAM_ADMIN_CHAT_IDS}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NODE_ENV: production
      ADMIN_PIN: ${ADMIN_PIN}
      MASTER_PIN: ${MASTER_PIN}
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
